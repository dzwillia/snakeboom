name: test

# One run per event, not two: pushes to main (merges), pull requests (the branch's run), and the
# deploy workflow calling this on a tag. A bare `push` also fired on every branch push and every
# tag, so a PR ran twice and a release ran the tests twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19; deploy calls this workflow and SSHes into the box, so no surprise runner migrations.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
