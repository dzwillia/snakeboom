name: deploy

# A v* tag builds the images, pushes them to GHCR and deploys them to the Happy Path box twice over:
# as the current release at snakeboom.com, and as the release's own stack at vX-Y-Z.snakeboom.com,
# which stays up after the next tag (infra/README.md: "Every release at its own subdomain").
# Dispatch with a tag to redeploy (or roll back to) an existing release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v0.17.0)'
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/snakeboom-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/snakeboom-web
  DOMAIN: snakeboom.com
  API_URL: https://api.snakeboom.com

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and deploy SSHes into the box; no surprise runner migrations.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      slug: ${{ steps.tag.outputs.slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: tag
        # The slug is the tag with dots as dashes: the subdomain the release lives at.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-z.-]+)?$ ]]; then
            echo "'$TAG' is not a release tag (vX.Y.Z)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "slug=${TAG//./-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the relay image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The site bakes its relay URL in at build time, so each release gets two site images from the same
      # source: one for its own subdomain (the durable one, tagged with the plain tag) and one for
      # snakeboom.com (tagged -current). The second build reuses every layer up to the vite build.
      - name: Build and push the site image for the release's own subdomain
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=https://api.${{ steps.tag.outputs.slug }}.${{ env.DOMAIN }}
            APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push the site image for snakeboom.com
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ env.API_URL }}
            APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}-current
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 and deploy SSHes into the box; no surprise runner migrations.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Copy the compose file, the Caddy fragments and the deploy scripts to the host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: infra/snakeboom/docker-compose.yml,infra/caddy.d/snakeboom.caddy,infra/caddy.d/snakeboom-release.caddy.tmpl,infra/render.sh,infra/deploy.sh,infra/teardown.sh
          target: /tmp/snakeboom-deploy
          strip_components: 0
      - name: Deploy on the host
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ env.API_URL }}
          DOMAIN: ${{ env.DOMAIN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: TAG,GHCR_USER,GHCR_TOKEN,API_URL,DOMAIN
          # infra/deploy.sh: current stack, release stack, Caddy fragments, retention, one reload, smoke tests.
          script: |
            set -euo pipefail
            export TAG GHCR_USER GHCR_TOKEN API_URL DOMAIN
            bash /tmp/snakeboom-deploy/infra/deploy.sh
